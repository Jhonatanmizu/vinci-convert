[project]
name = "vinci-convert"
version = "0.1.0"
description = "Convert videos to DaVinci Resolve compatible formats (ProRes) using ffmpeg — with a Catppuccin-themed terminal UI."
readme = "README.md"
license = { text = "GPL-3.0-only" }
authors = [{ name = "jhonatanmizu" }]
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12.5",
    "rich>=13.9.4",
    "pyside6>=6.8.0",
]

[project.scripts]
vinci-convert = "vinci_convert.cli:app"
vinci-convert-gui = "vinci_convert.gui:main"

[dependency-groups]
dev = [
    "pyinstaller>=6.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vinci_convert"]
